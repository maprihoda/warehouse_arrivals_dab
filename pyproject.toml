[project]
name = "warehouse-arrivals-dab"
version = "0.1.0"
description = "Databricks Asset Bundle for the warehouse arrivals Lakeflow SQL tutorial"
readme = "README.md"
authors = [{ name = "Marek Prihoda" }]
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8.3.5",
  "ruff>=0.11.0",
  "databricks-connect>=16.4,<16.5",
  "ipykernel>=6.29.5",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/warehouse_arrivals_dab"]

[tool.ruff]
line-length = 100
